# Refreshes the index monthly and opens a pull request with the changes.
name: Refresh prices
on:
  schedule:
    - cron: '0 5 3 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./cmd/pricegen fetch all
      - run: go run ./cmd/pricegen build
      - run: go test ./...
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: prices/refresh
          commit-message: "prices: monthly refresh"
          title: "Monthly price refresh"
          body: |
            Regenerated by `cmd/pricegen` from the providers' price APIs and ECB rates.
            Before merging: compare the README table with last month and check any change over 10%.
            `data/manual.json` is not refreshed automatically; check its `checked` date.
